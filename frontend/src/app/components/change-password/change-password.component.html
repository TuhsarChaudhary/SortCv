<div class="card">
  <div class="card-body">
    <h3 class="card-title">Change Password</h3>
    <form [formGroup]="passwordForm" (ngSubmit)="onSubmit()" novalidate>
      <div class="mb-3">
        <label for="oldPassword" class="form-label">Old Password</label>
        <input type="password" id="oldPassword" class="form-control" formControlName="oldPassword">
        <div *ngIf="submitted && f['oldPassword'].errors" class="text-danger">
          Old password is required.
        </div>
      </div>

      <div class="mb-3">
        <label for="newPassword" class="form-label">New Password</label>
        <input type="password" id="newPassword" class="form-control" formControlName="newPassword">
        <div *ngIf="submitted && f['newPassword'].errors" class="text-danger">
          <span *ngIf="f['newPassword'].errors['required']">New password is required.</span>
          <span *ngIf="f['newPassword'].errors['pattern']">Password must be at least 8 characters and include uppercase, lowercase, number and special character.</span>
        </div>
      </div>

      <div class="mb-3">
        <label for="confirmPassword" class="form-label">Confirm New Password</label>
        <input type="password" id="confirmPassword" class="form-control" formControlName="confirmPassword">
        <div *ngIf="submitted && f['confirmPassword'].errors" class="text-danger">
          <span *ngIf="f['confirmPassword'].errors['required']">Please confirm your new password.</span>
          <span *ngIf="f['confirmPassword'].errors['mustMatch']">Passwords do not match.</span>
        </div>
      </div>

      <button class="btn btn-primary" [disabled]="loading" type="submit">
        {{ loading ? 'Changing...' : 'Change Password' }}
      </button>

      <div *ngIf="error" class="alert alert-danger mt-3">{{ error }}</div>
      <div *ngIf="success" class="alert alert-success mt-3">{{ success }}</div>
    </form>
  </div>
</div>
