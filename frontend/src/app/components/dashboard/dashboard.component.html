<div class="dashboard-container">
  <div class="dashboard-header">
    <h1>Welcome to Your Dashboard</h1>
    <p *ngIf="currentUser">Hello, {{currentUser.fname}} {{currentUser.lname}}!</p>
  </div>

  <div class="dashboard-content">
    <div class="card">
      <div class="card-header">
        <h2>Account Information</h2>
      </div>
      <div class="card-body" *ngIf="currentUser">
        <div class="info-row">
          <span class="info-label">Name:</span>
          <span class="info-value">{{currentUser.fname}} {{currentUser.lname}}</span>
        </div>
        <div class="info-row">
          <span class="info-label">Email:</span>
          <span class="info-value">{{currentUser.email}}</span>
        </div>
        <div class="info-row">
          <span class="info-label">Account Type:</span>
          <span class="info-value">{{currentUser.is_admin ? 'Administrator' : 'Standard User'}}</span>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="card-header">
        <h2>Quick Actions</h2>
      </div>
      <div class="card-body">
        <div class="action-buttons">
          <button class="btn btn-primary" routerLink="/items">View Items</button>
          <button class="btn btn-secondary" routerLink="/profile">Edit Profile</button>
        </div>
      </div>
    </div>
  </div>
</div>
